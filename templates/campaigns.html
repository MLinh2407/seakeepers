<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaigns</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/campaigns.css') }}" />
</head>
<body class="{% if not session.get('user_id') %}logged-out{% endif %}">
  <header class="app-header">
    <a href="/" class="site-logo">SeaKeepers</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="/">Map</a>
      <a href="/dashboard">Analytics</a>
      <a href="/campaigns" aria-current="page">Campaigns</a>
      <a href="/profile">My Page</a>
    </nav>
    <div class="header-actions">
    <div id="notif-wrap">
      <button id="notif-bell" type="button" aria-label="Open notifications" aria-expanded="false">🔔<span id="notif-badge"></span></button>
      <div id="notif-dropdown"></div>
    </div>
    <div id="auth-panel" class="auth-panel">
      <button id="account-trigger" class="account-trigger" type="button" aria-expanded="false"><span class="account-avatar" aria-hidden="true">?</span><span id="account-label">Account</span></button>
      <div id="account-popover" class="account-popover">
        <div id="logged-out-panel">
          <p class="account-title">Join SeaKeepers</p><p class="account-copy">Sign in to report debris and join cleanups.</p>
          <form id="login-form" class="account-form"><label for="login-email">Email</label><input type="email" id="login-email" placeholder="you@example.com" required /><label for="login-password">Password</label><input type="password" id="login-password" placeholder="Your password" required /><button type="submit" class="primary-action">Log in</button></form>
          <details class="register-details"><summary>Create an account</summary><form id="register-form" class="account-form"><label for="reg-email">Email</label><input type="email" id="reg-email" placeholder="you@example.com" required /><label for="reg-username">Username</label><input type="text" id="reg-username" placeholder="Choose a username" required /><label for="reg-password">Password</label><input type="password" id="reg-password" placeholder="At least 8 characters" minlength="8" required /><button type="submit" class="secondary-action">Create account</button></form></details>
        </div>
        <div id="logged-in-panel" class="logged-in-panel"><p class="account-copy">Signed in as <strong id="current-username"></strong></p><a href="/profile" class="account-link">Open My Page</a><button id="logout-btn" class="logout-action" type="button">Log out</button></div>
        <p id="auth-message" class="message" role="status" aria-live="polite"></p>
      </div>
    </div>
    </div>
  </header>

  <div class="page-subheader page-subheader-back">
    <a href="/" class="back-link">Back to map</a>
  </div>

  <!-- Main Content -->
  <main class="campaigns-main">
    <h1 class="page-title">Campaigns</h1>

    <!-- Campaign Creation Form -->
    <section class="create-campaign-card">
      <h2>Organize a Cleanup</h2>

      <div id="popular-sites" class="popular-sites"></div>

      <form id="campaign-form">
        <label for="campaign-location">Location</label>
        <div class="location-input-wrap">
          <input type="text" id="campaign-location" placeholder="Search for a place..." autocomplete="off" />
          <ul id="campaign-location-suggestions" class="suggestions-list"></ul>
        </div>

        <label for="campaign-date">Date</label>
        <input type="date" id="campaign-date" required />

        <label for="campaign-description">Description</label>
        <textarea id="campaign-description" rows="3" placeholder="What's the plan?"></textarea>

        <label for="campaign-photo">Photo (optional, shown when shared)</label>
        <input type="file" id="campaign-photo" accept="image/*" />

        <button type="submit">Create campaign</button>
      </form>
      <p id="campaign-message" class="message"></p>
    </section>

    <!-- Upcoming Campaigns List -->
    <section class="campaigns-list-section">
      <h2>Upcoming Campaigns</h2>
      <div id="campaigns-list"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/campaigns.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
</body>
</html>
